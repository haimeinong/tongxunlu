<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>车间通讯录与排产工作台</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#1f2a44">
<!-- 平板/手机安装到桌面（PWA） -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="车间排产">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<style>
/* SECTION: base-css */
:root { --ink:#24314d; --gray:#6b7280; --line:#d5dae2; --bg:#eef1f5; --panel:#fff;
  --blue:#2e5395; --blue-d:#1f2a44; --green:#1a7f4e; --amber:#b45f06; --red:#b42318; --cyan:#0e7490; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif; font-size:14px; }
header.top { background:var(--blue-d); color:#fff; padding:0 14px; display:flex; align-items:center; gap:4px; flex-wrap:wrap; position:sticky; top:0; z-index:20; box-shadow:0 2px 6px rgba(0,0,0,.25); }
header.top .brand { font-weight:700; font-size:16px; padding:12px 12px 12px 0; letter-spacing:.5px; white-space:nowrap; }
header.top .navbtn { color:#cdd6e4; padding:13px 14px; font-size:14px; border:none; background:none; cursor:pointer; border-bottom:3px solid transparent; font-family:inherit; }
header.top .navbtn:hover { color:#fff; }
header.top .navbtn.on { color:#fff; border-bottom-color:#4f8ff7; background:rgba(255,255,255,.06); }
header.top .spacer { flex:1; }
header.top .ghost { border:1px solid #4a5878; background:transparent; color:#cdd6e4; border-radius:4px; padding:5px 12px; cursor:pointer; font-size:12px; font-family:inherit; }
header.top .ghost:hover { color:#fff; border-color:#8fa4c8; }
main { max-width:1280px; margin:0 auto; padding:16px 14px 80px; }
.view { display:none; } .view.on { display:block; }
.card { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-bottom:14px; box-shadow:0 1px 2px rgba(20,30,60,.05); }
.card > h2 { margin:0; font-size:15px; background:#f3f5f9; padding:9px 14px; border-bottom:1px solid var(--line); border-radius:6px 6px 0 0; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.card > h2 .sub { font-size:12px; color:var(--gray); font-weight:400; }
.pad { padding:12px 14px; }
.rowflex { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.muted { color:var(--gray); font-size:12px; }
.push { flex:1; }
/* SECTION: control-css */
button { cursor:pointer; border:1px solid var(--line); background:#fff; border-radius:4px; padding:5px 12px; font-size:13px; color:var(--ink); font-family:inherit; }
button:hover { background:#f0f3f8; }
button.pri { background:var(--blue); border-color:var(--blue); color:#fff; }
button.pri:hover { background:#27467d; }
button.ok { background:var(--green); border-color:var(--green); color:#fff; }
button.ok:hover { background:#156840; }
button.danger { color:var(--red); }
button.mini-btn { padding:3px 8px; font-size:12px; }
button.mini-btn.pri { color:#fff; }
input[type=text],input[type=number],input[type=date],input[type=search],input[type=tel],textarea,select { font:inherit; border:1px solid var(--line); border-radius:4px; padding:6px 8px; background:#fff; color:var(--ink); font-family:inherit; }
input:focus,select:focus,textarea:focus { outline:2px solid #b9cdf0; border-color:var(--blue); }
.form-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; align-items:end; }
.fld label { display:block; font-size:12px; color:var(--gray); margin-bottom:3px; }
.fld input,.fld select { width:100%; }
.toolbar { display:flex; gap:8px 10px; align-items:center; flex-wrap:wrap; background:#f8fafd; border:1px solid var(--line); border-radius:6px; padding:8px 10px; margin-bottom:12px; }
.toolbar .lab { font-size:12px; color:var(--gray); }
.toolbar input[type=search] { width:170px; }
.toolbar select { padding:4px 6px; max-width:150px; }
.unit-in { width:88px; }
/* SECTION: tag-badge */
.badge { display:inline-block; font-size:12px; padding:2px 10px; border-radius:10px; white-space:nowrap; }
.b-idle { background:#eceff3; color:#5b6470; }
.b-doing { background:#e2ecfb; color:var(--blue); }
.b-done { background:#dff3e8; color:var(--green); }
.b-late { background:#fde8e6; color:var(--red); }
.b-hold { background:#fdf1e3; color:var(--amber); }
.b-piece { background:#e6f4ff; color:#0b5cad; }
.b-day { background:#f3ecff; color:#6b35c4; }
.tabbar { display:flex; gap:6px; flex-wrap:wrap; }
.tabbar button { border-radius:16px; padding:5px 14px; }
.tabbar button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.chips { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
.chip { background:#e8edf5; color:var(--blue); font-size:12px; padding:4px 12px; border-radius:10px; cursor:pointer; border:1px solid transparent; }
.chip.on { background:var(--blue-d); color:#fff; }
.chip:hover { border-color:var(--blue); }
/* SECTION: stat-cards */
.stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:12px; }
.stat { background:#fff; border:1px solid var(--line); border-left:3px solid var(--blue); border-radius:6px; padding:9px 12px; }
.stat .k { font-size:12px; color:var(--gray); }
.stat .v { font-size:20px; font-weight:700; line-height:1.35; }
.stat .s { font-size:11px; color:var(--gray); }
.stat.g { border-left-color:var(--green); } .stat.a { border-left-color:var(--amber); }
.stat.r { border-left-color:var(--red); } .stat.c { border-left-color:var(--cyan); }
.stat.p { border-left-color:#6b35c4; }
/* SECTION: table-css */
.tw { overflow-x:auto; }
table.grid { border-collapse:collapse; width:100%; font-size:13px; }
table.grid th { background:#f3f5f9; text-align:left; padding:8px 10px; border:1px solid var(--line); white-space:nowrap; font-weight:600; }
table.grid td { padding:7px 10px; border:1px solid var(--line); vertical-align:middle; }
table.grid tr:hover td { background:#f8fafd; }
td.num,th.num { text-align:right; white-space:nowrap; }
tr.sumrow td { background:#f3f5f9; font-weight:700; }
.bar { background:#e6eaf1; border-radius:6px; height:9px; overflow:hidden; min-width:80px; }
.bar i { display:block; height:100%; background:var(--blue); border-radius:6px; transition:width .3s; }
.bar i.g { background:var(--green); } .bar i.r { background:var(--red); } .bar i.a { background:var(--amber); }
.barwrap { display:flex; align-items:center; gap:7px; min-width:130px; }
.barwrap .pct { font-size:12px; font-weight:700; min-width:40px; text-align:right; color:var(--gray); }
.who { display:flex; align-items:center; gap:8px; }
.avt { width:30px; height:30px; border-radius:50%; background:var(--blue); color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:600; flex:none; }
.avt.g { background:var(--green); } .avt.p { background:#6b35c4; } .avt.x { background:#8a94a8; }
.empty { text-align:center; color:var(--gray); padding:26px 10px; font-size:13px; }
a.link { color:var(--blue); text-decoration:none; }
.note { background:#f6f7fa; border:1px dashed var(--line); border-radius:6px; padding:8px 12px; font-size:12px; color:var(--gray); margin-bottom:12px; line-height:1.7; }
/* SECTION: cards-grid */
.kwrap { display:grid; grid-template-columns:repeat(auto-fill,minmax(330px,1fr)); gap:12px; }
.ocard { border:1px solid var(--line); border-radius:6px; background:#fff; padding:11px 13px; display:flex; flex-direction:column; gap:8px; }
.ocard.done { background:#fbfdfc; border-color:#c9e6d7; }
.ocard.late { background:#fffbfb; border-color:#f3cfcb; }
.ocard h3 { margin:0; font-size:15px; display:flex; justify-content:space-between; gap:8px; align-items:center; flex-wrap:wrap; }
.ocard h3 .no { font-family:ui-monospace,Consolas,monospace; font-size:14px; }
.ometa { display:flex; justify-content:space-between; gap:8px; flex-wrap:wrap; color:var(--gray); font-size:12px; }
.oline { display:flex; align-items:center; gap:8px; font-size:12px; }
.oline .pn { width:64px; flex:none; color:var(--gray); }
.oline .bar { flex:1; }
.ogrid { display:grid; grid-template-columns:repeat(2,1fr); gap:4px 10px; font-size:12px; }
.ogrid span { color:var(--gray); }
.foot { display:flex; gap:6px; flex-wrap:wrap; border-top:1px dashed var(--line); padding-top:8px; }
/* SECTION: modal-css */
.ovl { position:fixed; inset:0; background:rgba(15,23,42,.55); z-index:60; display:flex; align-items:center; justify-content:center; padding:14px; }
.ovl .box { background:#fff; border-radius:8px; width:100%; max-width:960px; max-height:90vh; display:flex; flex-direction:column; box-shadow:0 12px 40px rgba(0,0,0,.3); }
.ovl .box.sm { max-width:520px; } .ovl .box.md { max-width:720px; }
.ovl .box > h3 { margin:0; padding:11px 16px; border-bottom:1px solid var(--line); font-size:15px; display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
.ovl .obox { padding:12px 16px; overflow:auto; }
.ovl .fbot { padding:10px 16px; border-top:1px solid var(--line); display:flex; gap:8px; justify-content:flex-end; align-items:center; flex-wrap:wrap; }
.pick-list { max-height:300px; overflow:auto; border:1px solid var(--line); border-radius:5px; }
.pick-item { display:flex; align-items:center; gap:9px; padding:7px 10px; border-bottom:1px solid #eef1f5; }
.pick-item:last-child { border-bottom:none; }
.pick-item:hover { background:#f8fafd; }
.pick-item .nm { font-weight:600; min-width:76px; }
.pick-item input[type=number] { width:78px; text-align:right; padding:3px 6px; }
.pick-item .mini-lab { font-size:12px; color:var(--gray); }
.err { color:var(--red); font-size:12px; } .warn { color:var(--amber); font-size:12px; }
.tabs2 { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
.tabs2 button { border-radius:16px; padding:4px 12px; font-size:13px; }
.tabs2 button.on { background:var(--blue); border-color:var(--blue); color:#fff; }
.toast { position:fixed; left:50%; bottom:26px; transform:translateX(-50%); background:var(--blue-d); color:#fff; padding:9px 20px; border-radius:20px; font-size:13px; opacity:0; transition:.3s; pointer-events:none; z-index:90; }
.toast.show { opacity:.96; }
/* SECTION: charts */
.chart-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:12px; }
.chart-box { background:#fff; border:1px solid var(--line); border-radius:6px; padding:11px 13px; }
.chart-box h4 { margin:0 0 8px; font-size:14px; display:flex; justify-content:space-between; align-items:baseline; gap:8px; }
.chart-box h4 small { font-weight:400; color:var(--gray); font-size:12px; }
.legend { display:flex; gap:12px; flex-wrap:wrap; font-size:12px; color:var(--gray); margin-top:6px; }
.legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:4px; }
svg.ch { display:block; width:100%; height:auto; overflow:visible; }
@media (max-width:820px){
  table.grid,table.grid thead,table.grid tbody,table.grid tr,table.grid th,table.grid td { display:block; }
  table.grid thead { display:none; }
  table.grid tr { border:1px solid var(--line); margin-bottom:8px; border-radius:5px; overflow:hidden; }
  table.grid td { border:none; border-bottom:1px dashed var(--line); display:flex; justify-content:space-between; gap:12px; }
  table.grid td:before { content:attr(data-label); color:var(--gray); font-size:12px; flex:none; }
  table.grid td:last-child { border-bottom:none; }
  .ogrid { grid-template-columns:1fr 1fr; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">车间通讯录 · 排产</div>
  <button class="navbtn" data-nav="roster">① 车间通讯录</button>
  <button class="navbtn" data-nav="order">② 工单排产</button>
  <button class="navbtn" data-nav="stats">③ 效率与工资</button>
  <button class="navbtn" data-nav="data">④ 数据</button>
  <div class="spacer"></div>
  <button class="ghost" id="btn-quick-report">快速报工</button>
</header>
<main>
  <div id="view-roster" class="view on"></div>
  <div id="view-order" class="view"></div>
  <div id="view-stats" class="view"></div>
  <div id="view-data" class="view"></div>
</main>
<div id="modal-root"></div>
<div class="toast" id="toast"></div>
<script src="vendor/xlsx.full.min.js"></script>
<script>
/* ==================== 基础：状态 / 工具 ==================== */
var LS = 'ws_roster_dispatch_v5';
var LS_PREV = LS + '_prev';
var SNAP = LS + '_snap_';
var S = null;

function uid(p){ return (p||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
function $(sel,root){ return (root||document).querySelector(sel); }
function $$(sel,root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function n2(v){ var n=Number(v)||0; return (Math.round(n*100)/100).toString(); }
function n0(v){ return (Math.round(Number(v)||0)).toLocaleString('zh-CN'); }
function num(v,d){ var n=Number(v); return isFinite(n)?n:(d===undefined?0:d); }
function today(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function dayDiff(a,b){ // b - a，天
  var da=new Date(a+'T00:00:00'), db=new Date(b+'T00:00:00');
  return Math.round((db-da)/86400000);
}
function dateRange(days){ // 最近 N 天日期数组
  var arr=[]; var base=new Date();
  for(var i=days-1;i>=0;i--){ var d=new Date(base.getTime()-i*86400000); arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')); }
  return arr;
}
function toast(msg){
  var t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._tm); t._tm=setTimeout(function(){ t.classList.remove('show'); },2000);
}
function empName(id){ var e=findEmp(id); return e?e.name:'（已删除）'; }
function findEmp(id){ return S.employees.filter(function(e){ return e.id===id; })[0]||null; }
function findOrder(id){ return S.orders.filter(function(o){ return o.id===id; })[0]||null; }
function findAssign(id){ return S.assigns.filter(function(a){ return a.id===id; })[0]||null; }
function wsName(id){ var w=S.workshops.filter(function(x){ return x.id===id; })[0]; return w?w.name:'未分配'; }
function grpName(id){ var g=S.groups.filter(function(x){ return x.id===id; })[0]; return g?g.name:'—'; }
function empFull(e){ return wsName(e.wid)+' / '+grpName(e.gid); }
function orderLevel(o){ // 工单紧急度
  if(o.status==='done') return 'ok';
  var left=dayDiff(today(), o.due||today());
  if(left<0) return 'late'; if(left<=2) return 'near'; return 'ok';
}

/* ==================== 存取 ==================== */
function blank(){
  return { workshops:[], groups:[], employees:[], orders:[], assigns:[], reports:[], misc:[],
    settings:{ stdHours:8, otRate:1.5, miscRate:20 }, meta:{ created:today() } };
}
function parse(json){
  if(!json) return null;
  try{ var o=JSON.parse(json); if(!o||typeof o!=='object') return null; return o; }catch(e){ return null; }
}
function normalize(o){
  var b=blank();
  ['workshops','groups','employees','orders','assigns','reports'].forEach(function(k){ if(!Array.isArray(o[k])) o[k]=b[k]; });
  if(!Array.isArray(o.misc)) o.misc=[];
  o.settings=Object.assign({}, b.settings, o.settings||{});
  o.meta=Object.assign({}, b.meta, o.meta||{});
  migrateV5(o);
  return o;
}
// v4 → v5 迁移：班组类型 / 默认日工组 / 成品编号 / 完成日期 / 杂工时薪 / 杂工表
function migrateV5(o){
  o.groups.forEach(function(g){ if(g.type!=='piece'&&g.type!=='day') g.type='piece'; });
  o.orders.forEach(function(x){
    if(x.productCode===undefined) x.productCode='';
    if(x.doneOn===undefined) x.doneOn='';
    // 修正历史版本误存的单字母归属（w/g/e → workshop/group/person）
    if(x.belongType==='w') x.belongType='workshop';
    else if(x.belongType==='g') x.belongType='group';
    else if(x.belongType==='e') x.belongType='person';
  });
  o.workshops.forEach(function(w){
    var looseDay=o.employees.some(function(e){ return e.wid===w.id && e.type==='day' && !e.gid; });
    if(!looseDay) return;
    if(o.groups.some(function(g){ return g.wid===w.id && g.type==='day'; })) return;
    var ng={ id:uid('g'), wid:w.id, name:'日工组', type:'day' };
    o.groups.push(ng);
    o.employees.forEach(function(e){ if(e.wid===w.id && e.type==='day' && !e.gid) e.gid=ng.id; });
  });
}
function save(snapshot){
  try{
    if(snapshot){
      var old=localStorage.getItem(LS);
      if(old){ localStorage.setItem(LS_PREV, old); localStorage.setItem(SNAP+today(), old); trimSnap(); }
    }
    localStorage.setItem(LS, JSON.stringify(S));
  }catch(e){ alert('保存失败：' + e.message); }
}
function trimSnap(){
  try{
    var keys=Object.keys(localStorage).filter(function(k){ return k.indexOf(SNAP)===0; }).sort();
    while(keys.length>7){ localStorage.removeItem(keys.shift()); }
  }catch(e){}
}
function load(){
  var t=parse(localStorage.getItem(LS));
  if(!t){
    var keys=[]; try{ keys=Object.keys(localStorage); }catch(e){}
    var snaps=keys.filter(function(k){ return k.indexOf(SNAP)===0; }).sort();
    for(var i=snaps.length-1;i>=0;i--){ t=parse(localStorage.getItem(snaps[i])); if(t) break; }
  }
  if(!t) t=parse(localStorage.getItem(LS_PREV));
  return normalize(t||blank());
}
function snapList(){
  var keys=[]; try{ keys=Object.keys(localStorage); }catch(e){}
  return keys.filter(function(k){ return k.indexOf(SNAP)===0; }).sort().reverse()
    .map(function(k){ return { key:k, date:k.slice(SNAP.length), ok: !!parse(localStorage.getItem(k)) }; });
}

/* ==================== 计算核心 ==================== */
// 单条报工记录的工资（行级参考；日工应发以「日工结算」按天聚合为准）
function repWage(rep, emp, rate){
  var st=S.settings;
  var good=num(rep.qty)-num(rep.defect);
  if(emp.type==='piece'){
    if(num(rate)>0) return good*num(rate);              // 计件工干计件
    return num(rep.hours)*num(st.miscRate);             // 计件工干日工：杂工统一时薪
  }
  if(num(rate)>0) return good*num(rate);                // 日工借调计件：合格件 × 工单单价
  var h=num(rep.hours), std=num(st.stdHours)||8;        // 日工干日工
  return num(emp.dayRate)/std*(Math.min(h,std)+Math.max(0,h-std)*num(st.otRate));
}
function inPeriod(d, since, until){ return (!since||d>=since)&&(!until||d<=until); }
// 某人某次派工汇总
function assignStat(a){
  var emp=findEmp(a.eid); var st=S.settings;
  var reps=S.reports.filter(function(r){ return r.aid===a.id; });
  var done=0, defect=0, hours=0, eff=0, wage=0;
  reps.forEach(function(r){ done+=num(r.qty); defect+=num(r.defect); hours+=num(r.hours); eff+=num(r.eff); wage+=repWage(r, emp||{type:'piece'}, num(a.rate)); });
  var good=done-defect;
  return { reps:reps, done:done, defect:defect, good:good, hours:hours, eff:eff, wage:wage,
    planNum:num(a.planQty), reach:a.planQty>0? good/num(a.planQty) : (good>0?1:0),
    yieldRate: done>0? good/done : 1,
    effPH: eff>0? good/eff : 0,
    unitCost: good>0? wage/good : 0,
    useRate: hours>0? eff/hours : 0 };
}
// 工单汇总
function orderStat(o){
  var as=S.assigns.filter(function(a){ return a.oid===o.id; });
  var good=0, done=0, defect=0, hours=0, eff=0, wagePiece=0, wageDay=0, people={};
  as.forEach(function(a){
    var s=assignStat(a); var emp=findEmp(a.eid);
    good+=s.good; done+=s.done; defect+=s.defect; hours+=s.hours; eff+=s.eff;
    if(num(o.pieceRate)>0) wagePiece+=s.wage; else wageDay+=s.wage;
    if(s.done>0) people[a.eid]=1;
  });
  var plan=num(o.planQty);
  return { assigns:as, good:good, done:done, defect:defect, hours:hours, eff:eff,
    wage:wagePiece+wageDay, wagePiece:wagePiece, wageDay:wageDay,
    heads:as.length, activeHeads:Object.keys(people).length,
    reach: plan>0? good/plan : 0,
    unitCost: good>0? (wagePiece+wageDay)/good : 0 };
}
// 某人的全部派工汇总
function empStat(e, since, until, oid){
  var as=S.assigns.filter(function(a){ return a.eid===e.id && (!oid||a.oid===oid); });
  var good=0, done=0, defect=0, hours=0, eff=0, wage=0, orders={};
  as.forEach(function(a){
    var reps=S.reports.filter(function(r){ return r.aid===a.id; });
    if(since) reps=reps.filter(function(r){ return r.date>=since; });
    if(until) reps=reps.filter(function(r){ return r.date<=until; });
    var emp=e; var s={good:0,done:0,defect:0,hours:0,eff:0,wage:0};
    reps.forEach(function(r){ s.done+=num(r.qty); s.defect+=num(r.defect); s.hours+=num(r.hours); s.eff+=num(r.eff); s.wage+=repWage(r,emp,num(a.rate)); });
    s.good=s.done-s.defect;
    good+=s.good; done+=s.done; defect+=s.defect; hours+=s.hours; eff+=s.eff; wage+=s.wage;
    if(s.done>0) orders[a.oid]=1;
  });
  return { heads:1, good:good, done:done, defect:defect, hours:hours, eff:eff, wage:wage,
    orderCount:Object.keys(orders).length,
    effPH: eff>0? good/eff : 0,
    unitCost: good>0? wage/good : 0,
    useRate: hours>0? eff/hours : 0,
    yieldRate: done>0? good/done : 1 };
}

/* ---------- 结算聚合 ---------- */
// 日工按天结算：同一天全部工时合并后，扣减借调工时，再拆标准/加班
function daySettleRows(since, until){
  var map={};
  S.assigns.forEach(function(a){
    var emp=findEmp(a.eid); if(!emp||emp.type!=='day') return;
    var o=findOrder(a.oid);
    S.reports.forEach(function(r){
      if(r.aid!==a.id||!inPeriod(r.date,since,until)) return;
      var k=emp.id+'|'+r.date;
      if(!map[k]) map[k]={ e:emp, date:r.date, totalH:0, loanH:0, loanWage:0 };
      var h=num(r.hours);
      map[k].totalH+=h;
      if(o&&num(o.pieceRate)>0){ map[k].loanH+=h; map[k].loanWage+=(num(r.qty)-num(r.defect))*num(a.rate); }
    });
  });
  var std=num(S.settings.stdHours)||8;
  return Object.keys(map).map(function(k){
    var m=map[k], charge=Math.max(0,m.totalH-m.loanH);
    m.chargeH=charge; m.ot=Math.max(0,charge-std);
    m.wage=num(m.e.dayRate)/std*(Math.min(charge,std)+m.ot*num(S.settings.otRate));
    return m;
  }).sort(function(a,b){ return (a.e.code+a.date).localeCompare(b.e.code+b.date); });
}
// 计件班组结算（订单归属口径）：订单挂在哪个计件组，全部参与人员（本组/其他组计件工/日工）
// 的计件工资一律计入订单所在组，不随人员归属走；非本组人员部分单列「借调费(参考)」。
// 组实发 = 组计件工资 + 杂工费（组内计件工在日工工单上的工时费 + 杂工登记）。
function groupSettleRows(since, until){
  var map={};
  S.groups.filter(function(g){ return g.type==='piece'; }).forEach(function(g){
    map[g.id]={ g:g, pieceWage:0, loanWage:0, miscFee:0 };
  });
  // 1) 计件工单：按订单归属组计入
  S.assigns.forEach(function(a){
    var o=findOrder(a.oid), emp=findEmp(a.eid);
    if(!o||num(o.pieceRate)<=0||o.belongType!=='group') return;
    var m=map[o.belongId]; if(!m) return;
    S.reports.forEach(function(r){
      if(r.aid!==a.id||!inPeriod(r.date,since,until)) return;
      var w=(num(r.qty)-num(r.defect))*num(a.rate);
      m.pieceWage+=w;
      if(!emp||emp.gid!==m.g.id) m.loanWage+=w; // 非本组人员：其他组计件工或日工
    });
  });
  // 2) 杂工费：组内计件工在日工工单（pieceRate=0）上的报工 + 杂工登记
  S.groups.filter(function(g){ return g.type==='piece'; }).forEach(function(g){
    var m=map[g.id];
    S.employees.filter(function(emp){ return emp.gid===g.id; }).forEach(function(emp){
      S.assigns.filter(function(a){ return a.eid===emp.id; }).forEach(function(a){
        var o=findOrder(a.oid);
        if(o&&num(o.pieceRate)>0) return; // 计件订单（含借调其他组）按订单归属走，不算杂工
        S.reports.forEach(function(r){
          if(r.aid===a.id&&inPeriod(r.date,since,until))
            m.miscFee+=num(r.hours)*num(S.settings.miscRate);
        });
      });
      S.misc.forEach(function(mc){
        if(mc.eid===emp.id&&inPeriod(mc.date,since,until))
          m.miscFee+=num(mc.hours)*num(S.settings.miscRate);
      });
    });
  });
  return Object.keys(map).map(function(k){
    var m=map[k]; m.total=m.pieceWage+m.miscFee; return m;
  });
}
// 日工按人周期累计（用于「计件班组/日工结算」总览表中的日工行）
function dayEmpSums(since, until){
  var map={};
  daySettleRows(since,until).forEach(function(m){
    if(!map[m.e.id]) map[m.e.id]={ e:m.e, wage:0, loanWage:0 };
    map[m.e.id].wage+=m.wage;
    map[m.e.id].loanWage+=m.loanWage;
  });
  return Object.keys(map).map(function(k){ return map[k]; });
}
// 工资统计报表：一行一个已完工计件工单
function wageBillRows(since, until){
  return S.orders.filter(function(o){ return o.status==='done'&&num(o.pieceRate)>0&&inPeriod(o.doneOn,since,until); })
    .map(function(o){
      var s=orderStat(o);
      return { doneOn:o.doneOn||'', o:o, good:s.good, rate:num(o.pieceRate), wage:s.good*num(o.pieceRate) };
    }).sort(function(a,b){ return (a.doneOn+a.o.no).localeCompare(b.doneOn+b.o.no); });
}

/* ---------- 分组块（按小组/个人展示） ---------- */
function buildRosterBlocks(emps){
  var grouped={};
  emps.forEach(function(e){
    var key=e.gid || ('__p_'+e.id);
    if(!grouped[key]) grouped[key]={ gid:e.gid, members:[] };
    grouped[key].members.push(e);
  });
  var keys=Object.keys(grouped);
  keys.sort(function(a,b){
    var ma=grouped[a], mb=grouped[b];
    if(ma.gid && !mb.gid) return -1;
    if(!ma.gid && mb.gid) return 1;
    if(ma.gid && mb.gid){
      var ga=findGroup(ma.gid), gb=findGroup(mb.gid);
      return ((ga?wsName(ga.wid)+ga.name:'')).localeCompare((gb?wsName(gb.wid)+gb.name:''),'zh');
    }
    return ma.members[0].name.localeCompare(mb.members[0].name,'zh');
  });
  return keys.map(function(k){
    var blk=grouped[k], m=blk.members, os={};
    m.forEach(function(e){ activeOrdersOf(e.id).forEach(function(o){ os[o.id]=o; }); });
    return { gid:blk.gid, members:m, orders:Object.keys(os).map(function(id){ return os[id]; }) };
  });
}
function findGroup(id){ return S.groups.filter(function(g){ return g.id===id; })[0]||null; }
function blockTitle(b){
  if(b.gid){ var g=findGroup(b.gid); return { t:esc(g?g.name:'未分组'), sub:g?wsName(g.wid):'', cnt:b.members.length+' 人' }; }
  var e=b.members[0]; return { t:esc(e.name)+'（'+esc(e.code||'')+'）', sub:empFull(e), cnt:'单独人员' };
}

function filteredOrders(){
  var base=S.orders.filter(function(o){ return UI.showArchived || !o.archived; });
  return base.filter(function(o){
    if(UI.owid && o.wid!==UI.owid) return false;
    if(UI.ostatus==='late'){
      if(o.status==='done'||!o.due||dayDiff(today(),o.due)>=0) return false;
    } else if(UI.ostatus && o.status!==UI.ostatus) return false;
    if(UI.oq){
      var q=UI.oq.toLowerCase();
      if((o.no+o.name+(o.spec||'')).toLowerCase().indexOf(q)<0) return false;
    }
    return true;
  }).sort(function(a,b){
    var rank={doing:0,pending:1,hold:2,done:3};
    if(rank[a.status]!==rank[b.status]) return rank[a.status]-rank[b.status];
    return (a.due||'9999').localeCompare(b.due||'9999');
  });
}

function nextOrderNo(){
  var y=new Date().getFullYear(), m=String(new Date().getMonth()+1).padStart(2,'0');

  return prefix+String(max+1).padStart(3,'0');
}
function saveOrder(id){
  var no=$('#o-no').value.trim(), name=$('#o-name').value.trim();
  if(!no){ $('#o-err').textContent='生产工单号必填'; return; }
  var dup=S.orders.filter(function(x){ return x.no.toLowerCase()===no.toLowerCase() && x.id!==id; })[0];
  if(dup){ $('#o-err').textContent='工单号 '+no+' 已存在（'+dup.name+'）'; return; }
  var bv=$('#o-belong').value.split('|'), raw=bv[0], bid=bv[1];
  var wid='';
  if(raw==='w') wid=bid;
  else if(raw==='g'){ var g=findGroup(bid); wid=g?g.wid:''; }
  else if(raw==='e'){ var e=findEmp(bid); wid=e?e.wid:''; }
  var bt=({w:'workshop',g:'group',e:'person'})[raw]||'workshop'; // 统一为完整词口径
  var o={ no:no, productCode:$('#o-pcode').value.trim(), name:name, spec:$('#o-spec').value.trim(), wid:wid, belongType:bt, belongId:bt==='workshop'?'':bid,
    planQty:num($('#o-plan').value), unit:$('#o-unit').value.trim()||'件',
    pieceRate:num($('#o-rate').value), due:$('#o-due').value, status:$('#o-status').value,
    note:$('#o-note').value.trim() };
  var isNew=!id;
  if(id){ Object.assign(findOrder(id), o); o.id=id; } // 补 id，供后续自动派工正确关联
  else { o.id=uid('o'); o.createdAt=today(); o.archived=false; S.orders.push(o); }
  // 选班组/人员时自动派工
  if((isNew || bt!=='workshop') && (bt==='group'||bt==='person')){
    var targets = bt==='group'

function saveBatchReport(oid){
  var o=findOrder(oid); if(!o) return;
  var date=$('#b-date').value||today();
  var cks=$$('.bp-ck:checked');
  if(!cks.length){ toast('请勾选参加人员'); return; }
  var isPiece=num(o.pieceRate)>0;
  var aids=cks.map(function(c){ return c.value; }), n=aids.length;
  var total=0, tdef=0, qs={}, ds={};
  if(isPiece){
    total=num($('#b-total').value); tdef=num($('#b-tdef').value);
    if(total<=0){ toast('请填写班组总产量'); return; }
    if(tdef>total){ toast('总不良数不能大于总产量'); return; }
    var accQ=0, accD=0; // 均分，尾差给最后一人
    aids.forEach(function(aid,i){
      if(i<n-1){ qs[aid]=Math.round(total/n*100)/100; ds[aid]=Math.round(tdef/n*100)/100; accQ+=qs[aid]; accD+=ds[aid]; }
      else { qs[aid]=Math.round((total-accQ)*100)/100; ds[aid]=Math.round((tdef-accD)*100)/100; }
    });

function parseImportText(txt){
  txt=String(txt).replace(/^\ufeff/,'').trim();
  if(!txt){ toast('内容为空'); return; }
  var aoa = txt.indexOf('"')>=0 ? parseCSVtext(txt) : (function(){
    var lines=txt.split(/\r?\n/);
    var first=lines[0];
    var sep= first.indexOf('\t')>=0?'\t' : first.indexOf(';')>=0?';' : first.indexOf(',')>=0?',' : /\s{2,}/;
    return lines.map(function(l){ return l.split(sep).map(function(c){ return c.trim(); }); });
  })();
  showMapping(aoa);
}
function parseCSVtext(txt){
  var rows=[], row=[], cur='', q=false;
  for(var i=0;i<txt.length;i++){
    var c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){cur+='"';i++;} else q=false; } else cur+=c;
    } else if(c==='"') q=true;
      else if(c===','){ row.push(cur); cur=''; }
      else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
      else if(c!=='\r') cur+=c;
  }
  row.push(cur); rows.push(row);
  return rows;
}
function showMapping(aoa){
  aoa=aoa.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
  if(!aoa.length){ toast('未识别到有效行'); return; }
  var first=aoa[0].map(function(c){ return String(c).trim(); });
  var hasHead=first.some(function(h){ return IMP_FIELDS.some(function(f){ return f.al.indexOf(h.toLowerCase())>=0; }); });
  IMP.headers = hasHead? first : first.map(function(_,i){ return '第'+(i+1)+'列'; });
  IMP.rows = hasHead? aoa.slice(1) : aoa;
  IMP.map={};
  if(hasHead){
    IMP.headers.forEach(function(h,ci){
      IMP_FIELDS.forEach(function(f){
        if(f.al.indexOf(h.toLowerCase())>=0&&IMP.map[f.k]===undefined) IMP.map[f.k]=ci;
      });
    });
  } else ['no','name','spec','planQty','unit','pieceRate','due'].forEach(function(k,i){ if(i<IMP.headers.length) IMP.map[k]=i; });
  renderMapping();
}

    `<button data-act="modal-close">取消</button><button class="pri" id="imp-ok">确认导入</button>`, {size:'md'});
  $$('.imp-map').forEach(function(sel){
    sel.onchange=function(){
      var ci=num(this.getAttribute('data-ci'));

      if(this.value) IMP.map[this.value]=ci;

function groupSum(rows, keyFn){
  var map={}, order=[];
  rows.forEach(function(r){
    var k=keyFn(r); var label=(k&&k.label)||k;

    var m=map[k];
    m.qty+=r.qty; m.good+=r.good; m.defect+=r.defect; m.hours+=r.hours; m.eff+=r.eff;
    if(r.e.type==='piece') m.wageP+=r.wage; else m.wageD+=r.wage;
    m.wage+=r.wage; m.people[r.e.id]=1; m.days[r.date]=1;
  });
  return order.map(function(k){ var m=map[k]; return m; });

/* ---------- SVG 图表 ---------- */
function svgAxis(w){ return 'stroke="#e3e8ef" stroke-width="1"'; }
function svgStack(items, colors, legends){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  var rowH=30, padL=110, padR=86, w=520, gap=8;
  var max=0; items.forEach(function(m){ if(m.wage>max) max=m.wage; });
  if(max<=0) max=1;
  var h=items.length*rowH+10;
  var bw=w-padL-padR;
  var svg=[`<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMin meet">`];
  items.forEach(function(m,i){
    var y=i*rowH+6;
    var x1=padL + bw*m.wageP/max, x2=padL + bw*m.wage/max;
    svg.push(`<text x="${padL-8}" y="${y+13}" text-anchor="end" font-size="12" fill="#24314d">${esc(m.label.slice(0,7))}</text>`);
    svg.push(`<rect x="${padL}" y="${y}" width="${Math.max(0,bw*m.wage/max)}" height="17" fill="${colors[0]}" opacity=".18" rx="2"/>`);
    svg.push(`<rect x="${padL}" y="${y}" width="${Math.max(0,bw*m.wageP/max)}" height="17" fill="${colors[0]}" rx="2"/>`);
    svg.push(`<rect x="${x1}" y="${y}" width="${Math.max(0,x2-x1)}" height="17" fill="${colors[1]}" rx="2"/>`);
    svg.push(`<text x="${padL+bw+8}" y="${y+13}" font-size="11.5" fill="#6b7280">¥${n0(m.wage)}　${n0(m.good)}件</text>`);
    void padR;
  });
  svg.push('</svg>');
  svg.push(`<div class="legend">${legends.map(function(l,i){ return `<span><i style="background:${colors[i]}"></i>${l}</span>`; }).join('')}</div>`);
  return svg.join('');
}
function svgHBar(items, fmtVal, color){
  if(!items.length) return '<div class="empty">暂无数据</div>';
  var rowH=26, w=520, padL=76, padR=76;
  var max=0; items.forEach(function(m){ if(m.val>max) max=m.val; });
  if(max<=0) max=1;
  var bw=w-padL-padR, h=items.length*rowH+6;
  var svg=[`<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMin meet">`];
  items.forEach(function(m,i){
    var y=i*rowH+4;
    svg.push(`<text x="${padL-8}" y="${y+13}" text-anchor="end" font-size="12" fill="#24314d">${esc(m.label.slice(0,5))}</text>`);
    svg.push(`<rect x="${padL}" y="${y}" width="${bw}" height="15" fill="#f1f4f8" rx="2"/>`);
    svg.push(`<rect x="${padL}" y="${y}" width="${Math.max(1,bw*m.val/max)}" height="15" fill="${color}" opacity="${0.45+0.55*(i<3?1:0.6)}" rx="2"/>`);
    svg.push(`<text x="${padL+bw+6}" y="${y+13}" font-size="11.5" fill="#374151">${fmtVal(m.val)}</text>`);
  });
  svg.push('</svg>');
  return svg.join('');
}
function svgCombo(days){
  if(!days.length) return '<div class="empty">暂无数据</div>';
  var w=560, h=190, padL=44, padB=26, padT=12, padR=40;
  var iw=w-padL-padR, ih=h-padT-padB;
  var maxQ=0, maxW=0;
  days.forEach(function(d){ if(d.good>maxQ) maxQ=d.good; if(d.wage>maxW) maxW=d.wage; });
  if(maxQ<=0) maxQ=1; if(maxW<=0) maxW=1;
  var step=days.length>1? iw/days.length : iw;
  var bw=Math.max(4, Math.min(26, step*0.55));
  var svg=[`<svg class="ch" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMinYMin meet">`];
  // 网格
  for(var g=0;g<=3;g++){
    var y=padT+ih*g/3;
    svg.push(`<line x1="${padL}" y1="${y}" x2="${w-padR}" y2="${y}" ${svgAxis()}/>`);
  }
  var pts=[];
  days.forEach(function(d,i){
    var x=padL+step*i+step/2;
    var bh=ih*d.good/maxQ;
    svg.push(`<rect x="${x-bw/2}" y="${padT+ih-bh}" width="${bw}" height="${Math.max(1,bh)}" fill="#2e5395" opacity=".75" rx="2"/>`);
    pts.push([x, padT+ih-ih*d.wage/maxW]);
    if(days.length<=10 || i%Math.ceil(days.length/8)===0)
      svg.push(`<text x="${x}" y="${h-8}" text-anchor="middle" font-size="10" fill="#6b7280">${d.key.slice(5)}</text>`);
  });
  svg.push(`<polyline points="${pts.map(function(p){ return p[0]+','+p[1]; }).join(' ')}" fill="none" stroke="#b45f06" stroke-width="2"/>`);
  pts.forEach(function(p){ svg.push(`<circle cx="${p[0]}" cy="${p[1]}" r="2.6" fill="#b45f06"/>`); });
  svg.push(`<text x="4" y="${padT+8}" font-size="10" fill="#6b7280">产量峰值 ${n0(maxQ)}</text>`);
  svg.push(`<text x="${w-4}" y="${padT+8}" text-anchor="end" font-size="10" fill="#b45f06">成本峰值 ¥${n0(maxW)}</text>`);
  svg.push('</svg>');
  svg.push(`<div class="legend"><span><i style="background:#2e5395"></i>合格产量（件）</span><span><i style="background:#b45f06"></i>人工成本（元）</span></div>`);
  return svg.join('');
}

function download(name, content, mime){
  var m=mime||'text/plain';
  if(/text|json|csv/i.test(m)) m+=';charset=utf-8'; // 文本类型才加字符集，二进制保持纯净
  var blob=new Blob([content], { type:m });
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1500);
}

      .concat(S.orders.map(function(o){ var s=orderStat(o);

  } else if(kind==='misc'){
    download('杂工登记_'+today()+'.csv', csv([['日期','工号','姓名','所在计件组','工时','时薪','费用','备注']]

        return [m.date,e.code,e.name,grpName(e.gid),n2(m.hours),n2(S.settings.miscRate),
          n2(num(m.hours)*num(S.settings.miscRate)),m.note||''];

      .concat(ds.map(function(m){ return [m.date,m.e.code,m.e.name,wsName(m.e.wid),n2(m.totalH),n2(m.loanH),n2(m.chargeH),n2(m.ot),n2(m.wage),n2(m.loanWage),n2(m.wage)]; }))));
  } else if(UI.statTab==='bill'){
    var bs=wageBillRows(UI.since,UI.until);
    var bm={};
    bs.forEach(function(m){
      var key=(m.o.belongType==='group'&&m.o.belongId)?m.o.belongId:'__none';
      if(!bm[key]) bm[key]={list:[]};
      bm[key].list.push(m);
    });
    var bout=[['完成日期','工单号','成品编码','产品名称','规格型号','合格产出','计件单价','工资合计']];
    Object.keys(bm).forEach(function(key){
      var list=bm[key].list, sg=0, sw2=0, title;
      title=key==='__none'?'未指定班组':(grpName(key)+'（'+wsName((findGroup(key)||{wid:''}).wid)+'）');
      bout.push(['【'+title+'】完工 '+list.length+' 单','','','','','','','']);
      list.forEach(function(m){

function restore(key){

  confirmBox('恢复到 '+(key===LS_PREV?'上一次修改前':key.slice(SNAP.length))+' 的版本？当前数据会先备份一次。', function(){
    try{ localStorage.setItem(LS_PREV, JSON.stringify(S)); }catch(e){}
    S=normalize(t); save(); render(); toast('已恢复');
  });

      else if(v==='lastmonth'){
        var x=new Date(d.getFullYear(),d.getMonth()-1,1);
        UI.since=x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-01';
        var y=new Date(d.getFullYear(),d.getMonth(),0);
        UI.until=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');
      } else { UI.since=''; UI.until=''; }
      render(); break; }
    case 'sp-csv': exportSettleCSV(); break;
    /* --- 数据 --- */
    case 'export-json': download('车间通讯录与排产_'+today()+'.json', JSON.stringify(S,null,2), 'application/json'); toast('已导出备份'); break;
    case 'import-json': { var fi=$('#file-json'); if(fi){ fi.value=''; fi.click(); } break; }
    case 'restore-snap': restore(v); break;
    case 'save-settings': {
      S.settings.stdHours=num($('#set-h').value)||8; S.settings.otRate=num($('#set-ot').value);
      S.settings.miscRate=num($('#set-misc').value);
      save(true); render(); toast('计价规则已保存'); break; }
    case 'csv-staff': exportCSV('staff'); break;
    case 'csv-wage': exportCSV('wage'); break;
    case 'csv-report': exportCSV('report'); break;
    case 'csv-order': exportCSV('order'); break;
    case 'csv-misc': exportCSV('misc'); break;
    case 'csv-gsettle': exportCSV('gsettle'); break;
    case 'csv-dsettle': exportCSV('dsettle'); break;
    case 'load-seed': confirmBox('载入示例数据会覆盖当前全部数据，确定继续？', function(){
        S=seed(); save(true); render(); toast('示例数据已载入'); }); break;
    case 'wipe': confirmBox('⚠️ 将清空全部人员、工单、派工与报工数据（可先导出 JSON 备份）。确定清空？', function(){
        S=blank(); save(true); render(); toast('已清空'); }); break;
    /* --- 归档 --- */
    case 'toggle-arch': UI.showArchived=!UI.showArchived; render(); break;
    case 'ord-archive': {
      var od=findOrder(v); if(od){ od.archived=true; save(true); render(); toast('已归档：'+od.no); } break; }
    case 'ord-unarchive': {
      var odu=findOrder(v); if(odu){ odu.archived=false; save(true); render(); toast('已取消归档：'+odu.no); } break; }
    case 'archive-done': {
      var done=S.orders.filter(function(o){ return o.status==='done' && !o.archived; });
      if(!done.length){ toast('没有可归档的已完成工单'); break; }
      confirmBox('将归档全部 '+done.length+' 张「已完成」工单（归档后默认不显示，可在工具栏勾选「显示已归档」查看或取消归档）？', function(){
        done.forEach(function(o){ o.archived=true; }); save(true); render(); toast('已归档 '+done.length+' 张工单');
      }); break; }
    default: break;
  }
}
/* 文件导入 */
document.addEventListener('change', function(ev){
  var t=ev.target;
  if(t.id==='file-json' && t.files && t.files[0]){
    var fr=new FileReader();
    fr.onload=function(){
      var o=parse(fr.result);
      if(!o){ toast('文件格式不正确'); return; }
      confirmBox('导入将覆盖当前全部数据，确定继续？', function(){
        S=normalize(o); save(true); render(); toast('导入成功');
      });
    };
    fr.readAsText(t.files[0]);
  }
});
/* 单个人员派工：先选工单 */
function pickOrderForEmp(eid){
  var e=findEmp(eid); if(!e) return;
  var list=S.orders.filter(function(o){ return o.status!=='done'; });
  if(!list.length){ toast('没有可派工的工单，请先新建工单'); return; }
  var body=`<div class="note">把「${esc(e.name)}」派入所选工单。</div><div class="pick-list">${list.map(function(o){
    var s=orderStat(o);
    var has=S.assigns.filter(function(a){ return a.oid===o.id && a.eid===eid; })[0];
    return `<label class="pick-item"><input type="radio" name="po" value="${o.id}" ${has?'disabled':''}>
      <span class="nm">${esc(o.no)}</span><span class="mini-lab">${esc(o.name)}　${esc(wsName(o.wid))}　剩余 ${n0(Math.max(0,num(o.planQty)-s.good))} ${esc(o.unit)}</span>
      ${has?'<span class="muted">已派入</span>':''}</label>`; }).join('')}</div>
    <div class="form-grid" style="margin-top:10px">
      ${fld('本单计划产量', `<input type="number" id="po-plan" value="">`)}
      ${fld('本单计件单价', `<input type="number" step="0.01" id="po-rate" value="${e.type==='piece'?'':'0'}">`)}
    </div>`;
  openModal('派工 · '+e.name, body, `<button data-act="modal-close">取消</button><button class="pri" data-act="po-ok" data-v="${eid}">确定派入</button>`);
  $$('.pick-item input[name=po]').forEach(function(r){
    r.addEventListener('change', function(){ var o=findOrder(r.value); if(o&&e.type==='piece') $('#po-rate').value=n2(o.pieceRate); });
  });
}
/* po-ok：单个人员派入指定工单 */
function doPickOrder(eid){
  var e=findEmp(eid); if(!e) return;
  var sel=$$('.pick-item input[name=po]:checked')[0];
  if(!sel){ toast('请选择工单'); return; }
  var oid=sel.value, o=findOrder(oid);
  if(!o) return;
  if(S.assigns.filter(function(a){ return a.oid===oid && a.eid===eid; })[0]){ toast('该人员已在此工单中'); return; }
  var planEl=$('#po-plan');
  var plan=planEl && planEl.value!==''? num(planEl.value) : Math.max(1, Math.round(num(o.planQty)/4));
  S.assigns.push({ id:uid('a'), oid:oid, eid:eid, planQty:plan,
    rate: e.type==='piece'? ($('#po-rate').value!==''?num($('#po-rate').value):num(o.pieceRate)) : 0,
    startDate:today(), note:'' });
  if(o.status==='pending') o.status='doing';
  save(true); closeModal(); toast('已派入 '+o.no); go('order'); detailModal(oid);
}
/* 批量派工：多人 → 一个工单 */
function batchAssign(){
  var list=S.orders.filter(function(o){ return o.status!=='done'; });
  if(!list.length){ toast('没有可派工的工单'); return; }
  var cands=S.employees.filter(function(e){
    if(UI.wid && e.wid!==UI.wid) return false;
    if(UI.gid && e.gid!==UI.gid) return false;
    if(UI.q && (e.name+e.code).toLowerCase().indexOf(UI.q.toLowerCase())<0) return false;
    return e.status==='在岗';
  });
  if(!cands.length){ toast('当前筛选下没有人员'); return; }
  var body=`<div class="fld"><label>目标工单</label><select id="ba-oid">
      ${list.map(function(o){ return `<option value="${o.id}">${esc(o.no)} ${esc(o.name)}</option>`; }).join('')}</select></div>
    <div class="rowflex" style="margin:8px 0"><span class="lab">勾选人员（当前筛选 ${cands.length} 人）</span>
      <span class="push"></span><button class="mini-btn" id="ba-all">全选</button><button class="mini-btn" id="ba-none">全不选</button></div>
    <div class="pick-list">${cands.map(function(e){
      return `<label class="pick-item"><input type="checkbox" class="ba-ck" value="${e.id}">
        <span class="nm">${esc(e.name)}</span><span class="mini-lab">${esc(e.code)}　${esc(wsName(e.wid))}/${esc(grpName(e.gid))}</span>
        <span class="badge ${e.type==='piece'?'b-piece':'b-day'}">${e.type==='piece'?'计件':'日工'}</span></label>`; }).join('')}</div>`;
  openModal('批量派工', body, `<button data-act="modal-close">取消</button><button class="pri" id="ba-ok">确定派入</button>`);
  $('#ba-all').addEventListener('click', function(){ $$('.ba-ck').forEach(function(c){ c.checked=true; }); });
  $('#ba-none').addEventListener('click', function(){ $$('.ba-ck').forEach(function(c){ c.checked=false; }); });
  $('#ba-ok').addEventListener('click', function(){
    var oid=$('#ba-oid').value, o=findOrder(oid);
    var sel=$$('.ba-ck:checked');
    if(!sel.length){ toast('请勾选人员'); return; }
    var added=0;
    sel.forEach(function(c){
      var eid=c.value, e=findEmp(eid);
      if(S.assigns.filter(function(a){ return a.oid===oid&&a.eid===eid; })[0]) return;
      S.assigns.push({ id:uid('a'), oid:oid, eid:eid, planQty:0,
        rate: e.type==='piece'? num(o.pieceRate):0, startDate:today(), note:'' });
      added++;
    });
    if(o.status==='pending') o.status='doing';
    save(true); closeModal(); go('order'); toast('已派入 '+added+' 人'); detailModal(oid);
  });
}
/* ==================== 启动 ==================== */
function init(){
  S=load();
  var empty = !S.workshops.length && !S.employees.length && !S.orders.length;
  if(empty && !localStorage.getItem(LS)){ S=seed(); save(); }
  if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
  go('roster');
  var h=(location.hash||'').replace('#','');
  if(['order','stats','data','roster'].indexOf(h)>=0) go(h);
  if(empty) setTimeout(function(){ toast('已载入示例数据，可在「④数据」里清空后自行录入'); }, 400);
}
init();

</script>
